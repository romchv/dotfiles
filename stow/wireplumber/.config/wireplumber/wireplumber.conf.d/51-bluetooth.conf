# Keep Bluetooth headphones on high-quality A2DP. Without this, any app
# opening a mic flips them to the mono 16 kHz headset profile, and they
# don't always switch back (each profile also has its own volume).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

# Leave out LDAC (adaptive bitrate, audibly drops quality on a weak link)
# and aptX HD, so aptX is picked: fixed bitrate, steady quality.
monitor.bluez.properties = {
  bluez5.codecs = [ aptx aac sbc_xq sbc msbc cvsd ]
}
