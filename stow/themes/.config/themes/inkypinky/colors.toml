# InkyPinky — deep ink, dusty mauve and soft pinks
# Ported from omarchy-inkypinky-theme.

mode                     = "dark"

# Signal, selection and the de-emphasised ramp
accent                   = "#7c7ca8"
selection                = "#2c293f"
selection_background     = "#c8c8c8"
selection_foreground     = "#13131d"
muted                    = "#817d91"

# Ground, from the deepest surface up to the elevated one
background               = "#13131d"
dark_background          = "#0e0e16"
darker_background        = "#0a0a0f"
lighter_background       = "#222030"

# Text, from de-emphasised up to the cursor
foreground               = "#c8c8c8"
dark_foreground          = "#9a95ab"
light_foreground         = "#e0dce8"
bright_foreground        = "#c8c8c8"

# Window borders: mauve into ink-blue.
hyprland_active_border   = "rgba(b57b97ee) rgba(7c7ca8ee) 45deg"

# Named colours
red                      = "#ea90a8"
yellow                   = "#d18ba2"
orange                   = "#f0a8b0"
green                    = "#a6b2c7"
cyan                     = "#919ab7"
blue                     = "#7c7ca8"
magenta                  = "#9f859f"
brown                    = "#d18ba2"

# Bright variants
bright_red               = "#f6bfce"
bright_yellow            = "#e3aebf"
bright_green             = "#d1d9e4"
bright_cyan              = "#d2d7e3"
bright_blue              = "#bcbcd4"
bright_magenta           = "#bfadbf"
